<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>跟機器人猜拳</title>
<link rel="stylesheet" href="/common/style.css">
<style>
  .duel { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; text-align: center; gap: 8px; }
  .duel .who { color: var(--muted); font-size: 14px; }
  .duel .hand { font-size: 56px; line-height: 1.2; min-height: 68px; }
  .duel .pts { font-size: 32px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .duel .vs { color: var(--muted); font-weight: 700; }
  .result { text-align: center; font-size: 22px; font-weight: 800; min-height: 34px; margin-top: 6px; }
  .result.win { color: var(--good); }
  .result.lose { color: var(--bad); }
  .history { display: flex; gap: 6px; flex-wrap: wrap; min-height: 28px; font-size: 20px; }
  .history span { padding: 2px 8px; border-radius: 8px; background: var(--surface-2); font-size: 14px; }
  .history .w { background: color-mix(in srgb, var(--good) 25%, var(--surface)); }
  .history .l { background: color-mix(in srgb, var(--bad) 22%, var(--surface)); }
  .seen { font-size: 18px; font-weight: 700; }
</style>
</head>
<body>
<main class="game">
  <section id="stage">
    <div class="overlay"><div class="big" id="big"></div></div>
    <div class="hint">把手放在鏡頭前、手掌對著鏡頭，比較好認</div>
  </section>

  <aside class="panel">
    <div class="card">
      <div class="duel">
        <div><div class="who">你</div><div class="hand" id="you">❔</div><div class="pts" id="you-pts">0</div></div>
        <div class="vs">VS</div>
        <div><div class="who">機器人</div><div class="hand" id="bot">🤖</div><div class="pts" id="bot-pts">0</div></div>
      </div>
      <div class="result" id="result"></div>
    </div>
    <div class="card" id="task-card">
      <h2>現在</h2>
      <div class="task" id="task">張開手掌 🖐️ 2 秒開始</div>
      <div class="bar"><i id="hold"></i></div>
    </div>
    <div class="card">
      <h2>鏡頭看到你的手</h2>
      <div class="seen" id="seen">（沒有看到手）</div>
      <h2 style="margin-top: 10px;">每一局</h2>
      <div class="history" id="history"></div>
    </div>
    <button class="btn" id="start">開始</button>
    <div class="card" id="robot"></div>
  </aside>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
