<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>圖卡問答</title>
<link rel="stylesheet" href="/common/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="elder">
<!-- 有 id 的元素 game.js 會用到：可以搬位置、改樣式，但不要刪除或改名。清單在 CONTRIBUTING.md -->
<main class="game">
  <section id="stage">
    <div class="overlay"><div class="big" id="big"></div></div>
    <div class="hint">把圖卡拿穩、黑白方塊對著鏡頭，手指不要擋住方塊</div>
  </section>

  <aside class="panel">
    <div class="card" id="task-card">
      <h2 id="progress">請拿出</h2>
      <div class="target">
        <div class="pic" id="pic">🃏</div>
        <div class="task" id="task">按「開始」</div>
      </div>
      <div class="clue" id="clue">或拿任何一張圖卡 3 秒</div>
      <div class="bar"><i id="hold"></i></div>
    </div>

    <div class="row">
      <button class="btn" id="start">開始</button>
      <button class="btn secondary" id="repeat" disabled>再說一次</button>
    </div>

    <div class="card">
      <h2>鏡頭看到</h2>
      <div class="seen" id="seen">（沒有看到圖卡）</div>
    </div>

    <div class="card" id="summary" hidden>
      <h2>這一輪的紀錄（給照服員看，不會存檔）</h2>
      <ol class="results" id="results"></ol>
    </div>

    <details class="card setup" id="setup">
      <summary>照服員設定</summary>
      <div class="row setup-row">
        <span>題數</span>
        <select id="count">
          <option value="3">3 題</option>
          <option value="5" selected>5 題</option>
          <option value="8">8 題</option>
        </select>
        <button class="btn secondary" id="skip" disabled>跳過這題</button>
      </div>
      <p class="muted">桌上放了哪些圖卡？只會從勾選的卡出題（點一下切換）：</p>
      <div class="deck" id="deck"></div>
    </details>

    <div class="card" id="robot"></div>
    <a class="muted" href="/cards/print.html" target="_blank">🖨 列印圖卡</a>
  </aside>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
