<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>圖卡問答</title>
<link rel="stylesheet" href="/common/style.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 有 id 的元素 game.js 會用到：可以搬位置、改樣式，但不要刪除或改名。清單在 CONTRIBUTING.md -->
<main class="game">
  <section id="stage">
    <div class="overlay"><div class="big" id="big"></div></div>
    <div class="hint">把圖卡拿穩、黑白方塊對著鏡頭，手指不要擋住方塊</div>
  </section>

  <aside class="panel">
    <div class="card" id="task-card">
      <h2>請拿出</h2>
      <div class="target">
        <div class="pic" id="pic">🃏</div>
        <div><div class="task" id="task">按「開始」</div><div class="en" id="en">或拿任何一張圖卡 2 秒</div></div>
      </div>
      <div class="bar"><i id="hold"></i></div>
    </div>
    <div class="card">
      <h2>鏡頭看到</h2>
      <div class="seen" id="seen">（沒有看到圖卡）</div>
    </div>
    <div class="card">
      <div class="stats">
        <div><b id="done">0/10</b><span>答對</span></div>
        <div><b id="wrong">0</b><span>拿錯</span></div>
        <div><b id="clock">0.0</b><span>秒</span></div>
      </div>
      <div class="muted" style="margin-top: 8px; text-align: center;">最快紀錄：<span id="best">—</span></div>
    </div>
    <div class="row">
      <button class="btn" id="start">開始</button>
      <button class="btn secondary" id="skip" disabled>跳過這題</button>
    </div>
    <div class="card" id="robot"></div>
    <a class="muted" href="/cards/print.html" target="_blank">🖨 列印圖卡</a>
  </aside>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
