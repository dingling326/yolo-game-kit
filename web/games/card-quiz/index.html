<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>圖卡問答</title>
<link rel="stylesheet" href="/common/style.css">
<style>
  .target { display: flex; align-items: center; gap: 14px; }
  .target .pic { font-size: 64px; line-height: 1; }
  .target .en { color: var(--muted); font-size: 15px; }
  .seen { font-size: 18px; font-weight: 700; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .stats b { display: block; font-size: 28px; font-variant-numeric: tabular-nums; }
  .stats span { color: var(--muted); font-size: 13px; }
  .big.good { color: #3fcf8e; }
  .big.bad { color: #ff8a80; }
</style>
</head>
<body>
<main class="game">
  <section id="stage">
    <div class="overlay"><div class="big" id="big"></div></div>
    <div class="hint">把圖卡拿穩、黑白方塊對著鏡頭，手指不要擋住方塊</div>
  </section>

  <aside class="panel">
    <div class="card" id="task-card">
      <h2>請拿出</h2>
      <div class="target">
        <div class="pic" id="pic">🃏</div>
        <div><div class="task" id="task">按「開始」</div><div class="en" id="en">或拿任何一張圖卡 2 秒</div></div>
      </div>
      <div class="bar"><i id="hold"></i></div>
    </div>
    <div class="card">
      <h2>鏡頭看到</h2>
      <div class="seen" id="seen">（沒有看到圖卡）</div>
    </div>
    <div class="card">
      <div class="stats">
        <div><b id="done">0/10</b><span>答對</span></div>
        <div><b id="wrong">0</b><span>拿錯</span></div>
        <div><b id="clock">0.0</b><span>秒</span></div>
      </div>
      <div class="muted" style="margin-top: 8px; text-align: center;">最快紀錄：<span id="best">—</span></div>
    </div>
    <div class="row">
      <button class="btn" id="start">開始</button>
      <button class="btn secondary" id="skip" disabled>跳過這題</button>
    </div>
    <div class="card" id="robot"></div>
    <a class="muted" href="/cards/print.html" target="_blank">🖨 列印圖卡</a>
  </aside>
</main>
<script type="module" src="game.js"></script>
</body>
</html>
